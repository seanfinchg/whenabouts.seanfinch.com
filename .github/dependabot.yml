# Weekly update PRs into dev. Nothing auto-merges.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Skip versions published in the last 3 days.
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 passes tsc here, but typescript-eslint 8.72 refuses it (peer
      # typescript <6.1.0, "does not support TS 7.0"). Drop this once it supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
